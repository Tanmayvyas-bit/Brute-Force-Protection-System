<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Login — CSL-G16</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Secure Login</h1>
    <p class="mode {{ 'on' if protected else 'off' }}">
      Protections: {{ 'ENABLED' if protected else 'DISABLED' }}
    </p>

    {% if message %}
      <p class="msg">{{ message }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <label>Username
        <input type="text" name="username" autocomplete="off" required>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="off" required>
      </label>

      {% if show_captcha %}
        <label class="captcha">CAPTCHA — what is {{ captcha_q }}?
          <input type="text" name="captcha" autocomplete="off" required>
        </label>
      {% endif %}

      <button type="submit">Log in</button>
    </form>

    <p class="hint">Test account: <code>admin</code> / <code>Summer@2025</code>
       (dummy lab credentials)</p>
  </main>
</body>
</html>
